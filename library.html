<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookGarden - Library</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Book Garden</h1>
      <button id="enterReaderBtn">Enter Reader</button>
      <button id="browseBtn">Add Book</button>
      <input type="file" id="epubFile" accept=".epub" hidden />
    </header>
    <main>
      <div id="library" class="library-grid">
        <p>Loading library...</p>
      </div>
    </main>
    <footer>
      <span id="location">Library</span>
    </footer>
    <script type="module" src="/src/library.js"></script>
  </body>
</html>
