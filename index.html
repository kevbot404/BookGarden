<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book Garden</title>

    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <header>
      <h1>Book Garden</h1>

      <input type="file" id="epubFile" accept=".epub" />
    </header>
    <main>
      <aside id="toc" class="toc">
        <div class="toc-header">
          <h2>Contents</h2>

          <button id="closeToc">×</button>
        </div>

        <div id="tocList" class="toc-list"></div>
      </aside>

      <div id="reader"></div>
    </main>

    <footer>
      <button id="tocButton">☰ Contents</button>

      <button id="previous">← Previous</button>

      <span id="location"> No book loaded </span>

      <button id="next">Next →</button>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
