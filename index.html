<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book Garden</title>

    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <header>
      <h1>Book Garden</h1>

      <input type="file" id="epubFile" accept=".epub" hidden />

      <button id="browseBtn" type="button">Open EPUB</button>

      <span id="bookTitle"> No book loaded </span>
    </header>

    <main>
      <aside id="toc" class="toc">
        <div class="toc-header">
          <h2>Contents</h2>

          <button id="closeToc" type="button">×</button>
        </div>

        <div id="tocList" class="toc-list"></div>
      </aside>

      <div id="reader"></div>
    </main>

    <!-- Reader settings -->
    <section id="readerSettings" class="reader-settings">
      <div class="setting-group">
        <label for="fontFamily"> Font </label>

        <select id="fontFamily">
          <option value="Georgia, serif">Georgia</option>

          <option value="Arial, sans-serif">Arial</option>

          <option value="Verdana, sans-serif">Verdana</option>

          <option value="'Times New Roman', serif">Times New Roman</option>

          <option value="system-ui, sans-serif">System</option>
        </select>
      </div>

      <div class="setting-group">
        <span>Font size</span>

        <button id="fontDecrease" type="button">A−</button>

        <button id="fontIncrease" type="button">A+</button>
      </div>

      <div class="setting-group">
        <label for="lineHeight"> Line spacing </label>

        <select id="lineHeight">
          <option value="1.2">Compact</option>

          <option value="1.4">Normal</option>

          <option value="1.6" selected>Comfortable</option>

          <option value="1.8">Spacious</option>

          <option value="2">Very spacious</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="theme"> Theme </label>

        <select id="theme">
          <option value="light">Light</option>

          <option value="sepia">Sepia</option>

          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="textAlign"> Alignment </label>

        <select id="textAlign">
          <option value="left">Left</option>

          <option value="justify">Justified</option>

          <option value="center">Center</option>

          <option value="right">Right</option>
        </select>
      </div>

      <button id="resetSettings" type="button">Reset</button>
    </section>

    <footer>
      <button id="tocButton" type="button">☰ Contents</button>

      <button id="previous" type="button">← Previous</button>

      <span id="location"> No book loaded </span>

      <button id="next" type="button">Next →</button>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
